    "passiveSidebar": "\n        <div id=\"side-sec-1\" style=\"background:#27272a; border:1px solid #3f3f46; padding:10px; margin-top:10px; border-radius:6px;\">\n            <div style=\"display:flex; justify-content:space-between; align-items:center;\">\n                <b style=\"font-size: 12px; color: #a1a1aa; cursor:pointer;\" onclick=\"toggleSectionCollapse(1, document.getElementById('side-toggle-btn-1'))\">SECTION 1</b>\n                <div style=\"display:flex; gap: 4px;\">\n                    <button id=\"side-toggle-btn-1\" class=\"gui-minimize-btn\" onclick=\"toggleSectionCollapse(1, this)\" title=\"Collapse Section\">−</button>\n                    <button class=\"gui-minimize-btn\" onclick=\"moveSection(1, -1)\" title=\"Move Up\">↑</button>\n                    <button class=\"gui-minimize-btn\" onclick=\"moveSection(1, 1)\" title=\"Move Down\">↓</button>\n                    <button onclick=\"confirmDeleteSection(this, 1)\" title=\"Delete\" style=\"background:#ef4444; color:white; border:none; width:22px; height:22px; font-size:12px; cursor:pointer; font-weight:bold; border-radius:3px; display:flex; justify-content:center; align-items:center;\">×</button>\n                </div>\n            </div>\n            <div id=\"side-content-1\">\n                <!-- Header Input & Header Debuff Shortcuts -->\n                <div style=\"margin-top:6px; margin-bottom:4px;\">\n                    <input type=\"text\" id=\"input-sec-hdr-1\" oninput=\"updateHeader(1, this.value)\" value=\"Activates the Entrance Animation upon the character's entry\" class=\"form-control form-control-sm mb-1\">\n                    <div style=\"display:flex; gap:3px; width:100%; flex-wrap:wrap; margin-bottom:6px;\">\n                        <span style=\"font-size:9px; color:#888; align-self:center; font-weight:bold; margin-right:2px;\">Header:</span>\n                        <button onclick=\"insertShortcut('input-sec-hdr-1', ':atk_down:')\" title=\"ATK Down\" style=\"font-
